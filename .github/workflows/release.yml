name: PlatformIO Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on tags like v1.0, v2.5.1
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PLATFORMIO_BUILD_FLAGS: "-DFIRMWARE_VERSION='\"${{ github.ref_name }}\"'"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetch all history for git describe
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install PlatformIO
      run: pip install -U platformio
    - name: Set UI version
      if: startsWith(github.ref, 'refs/tags/')
      run: python set_ui_version.py ${{ github.ref_name }}
    - name: Build PlatformIO Project
      run: pio run -e esp32dev
    - name: Build Filesystem Image
      run: pio run -e esp32dev -t buildfs
    - name: Merge Binaries
      run: pio pkg exec -p "tool-esptoolpy" -- esptool.py --chip esp32 merge_bin -o .pio/build/esp32dev/complete-firmware.bin 0x1000 .pio/build/esp32dev/bootloader.bin 0x8000 .pio/build/esp32dev/partitions.bin 0x10000 .pio/build/esp32dev/firmware.bin 0x150000 .pio/build/esp32dev/firmware.bin 0x290000 .pio/build/esp32dev/littlefs.bin
    - name: Upload firmware binary
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: .pio/build/esp32dev/firmware.bin
    - name: Upload filesystem image
      uses: actions/upload-artifact@v4
      with:
        name: littlefs
        path: .pio/build/esp32dev/littlefs.bin
    - name: Upload complete firmware binary
      uses: actions/upload-artifact@v4
      with:
        name: complete-firmware
        path: .pio/build/esp32dev/complete-firmware.bin

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - uses: actions/checkout@v4
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
      - name: Download filesystem artifact
        uses: actions/download-artifact@v4
        with:
          name: littlefs
      - name: Download complete firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: complete-firmware
      - name: Create GitHub Release with Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          mv ./firmware.bin "./firmware-${TAG}.bin"
          mv ./littlefs.bin "./littlefs-${TAG}.bin"
          mv ./complete-firmware.bin "./complete-firmware-${TAG}.bin"
          if [ -f RELEASE_NOTES.md ]; then
            gh release create "${TAG}" \
              "./firmware-${TAG}.bin" \
              "./littlefs-${TAG}.bin" \
              "./complete-firmware-${TAG}.bin" \
              --title "Release ${TAG}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${TAG}" \
              "./firmware-${TAG}.bin" \
              "./littlefs-${TAG}.bin" \
              "./complete-firmware-${TAG}.bin" \
              --title "Release ${TAG}" \
              --generate-notes
          fi
